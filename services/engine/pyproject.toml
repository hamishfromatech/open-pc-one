[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "openpc-engine"
version = "0.1.0"
description = "Open-PC One: bridges a-coder-cli RPC (JSONL stdio) to a WSS edge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The A-Tech Corporation PTY LTD" }]
# Pinned exactly: an unattended appliance must not receive an unpinned update.
dependencies = [
    "websockets==15.0.1",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
]

[project.scripts]
openpc-engine = "openpc_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openpc_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
