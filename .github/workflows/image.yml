name: image

# Build the x86_64 appliance image on a real x86_64 Linux host, then cold-boot
# it in QEMU and assert the appliance units come up. This machine is arm64 and
# has no Docker; GitHub's ubuntu-24.04 runners are x86_64 and free for a public
# repository, so the build lives here.
#
# The image is produced with mkosi, not Docker. Everything the image bakes in
# (wheels, cua-driver, a-coder-cli, llama.cpp) is pinned and hashed first.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/image.yml"
      - "os/**"
      - "services/**"
      - "config/models.json"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  ACODER_TAG: v0.80.194
  CUA_TAG: cua-driver-rs-v0.33.3
  # Pinned upstream llama.cpp commit; it contains src/models/lfm3.cpp.
  LLAMA_COMMIT: bee23322f1baa3d2dd16b8339bed6aff4a8eb663
  MKOSI_OUTPUT: /mnt/mkosi-out
  MKOSI_CACHE: /mnt/mkosi-cache

jobs:
  artifacts:
    name: pin linux-x64 artefacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake build-essential

      - name: a-coder-cli (linux-x64, pinned release)
        run: |
          set -euo pipefail
          mkdir -p os/image/artifacts /tmp/acoder
          base="https://github.com/hamishfromatech/a-coder-cli/releases/download/${ACODER_TAG}"
          # Download under the exact name SHA256SUMS lists, otherwise the
          # checksum line cannot be verified (`pi.tgz' != `pi-linux-x64.tar.gz').
          curl -fsSL "$base/pi-linux-x64.tar.gz" -o /tmp/acoder/pi-linux-x64.tar.gz
          curl -fsSL "$base/SHA256SUMS" -o /tmp/acoder/SHA256SUMS
          (cd /tmp/acoder && grep 'pi-linux-x64.tar.gz' SHA256SUMS | sha256sum -c -)
          tar -xzf /tmp/acoder/pi-linux-x64.tar.gz -C /tmp/acoder
          bin="$(find /tmp/acoder -type f -name pi -perm -u+x | head -1)"
          test -n "$bin"
          install -m 0755 "$bin" os/image/artifacts/a-coder-cli
          ./os/image/artifacts/a-coder-cli --version || ./os/image/artifacts/a-coder-cli --help | head -5

      - name: cua-driver (linux-x86_64, pinned release)
        run: |
          set -euo pipefail
          ver="${CUA_TAG#cua-driver-rs-v}"
          url="https://github.com/trycua/cua/releases/download/${CUA_TAG}/cua-driver-rs-${ver}-linux-x86_64.tar.gz"
          curl -fsSL "$url" -o /tmp/cua-driver.tgz
          mkdir -p /tmp/cua-driver
          tar -xzf /tmp/cua-driver.tgz -C /tmp/cua-driver
          bin="$(find /tmp/cua-driver -type f -name cua-driver | head -1)"
          test -n "$bin"
          install -m 0755 "$bin" os/image/artifacts/cua-driver
          file os/image/artifacts/cua-driver

      - name: llama.cpp with lfm3 (linux-x64, built from pinned commit)
        run: |
          set -euo pipefail
          git init /tmp/llama
          cd /tmp/llama
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "$LLAMA_COMMIT"
          git checkout --detach FETCH_HEAD
          grep -q lfm3 src/models/lfm3.cpp
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_OPENMP=OFF \
            -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build --target llama-server llama-cli -j"$(nproc)"
          mkdir -p /tmp/pkg/llama.cpp
          cp build/bin/llama-server build/bin/llama-cli /tmp/pkg/llama.cpp/
          # The image extracts with --strip-components=1, so the tarball carries
          # a single top-level directory.
          tar -czf "$GITHUB_WORKSPACE/os/image/artifacts/llama.cpp-lfm3.tar.gz" \
            -C /tmp/pkg llama.cpp
          tar -tzf "$GITHUB_WORKSPACE/os/image/artifacts/llama.cpp-lfm3.tar.gz"
          /tmp/pkg/llama.cpp/llama-server --version

      - name: Pin hashes
        run: |
          ./os/scripts/pin-artifacts
          ./os/scripts/pin-artifacts --check
          cat os/image/artifacts/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: openpc-artifacts
          path: os/image/artifacts
          if-no-files-found: error
          retention-days: 14

  image:
    name: build image and boot it
    needs: artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openpc-artifacts
          path: os/image/artifacts

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / /mnt

      - name: Install mkosi and boot tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git python3-venv python3-pip \
            xz-utils zstd dosfstools mtools e2fsprogs bubblewrap \
            systemd-container systemd-boot systemd-boot-efi systemd-ukify \
            debootstrap debian-archive-keyring \
            qemu-system-x86 qemu-utils ovmf

          # Ubuntu noble ships debian-archive-keyring 2023.4, which predates the
          # keys trixie's archive is signed with (04cb5019.../04b8e5f1...).
          # mkosi's apt bootstrap then dies with NO_PUBKEY, so install trixie's
          # keyring package itself; version and hash come from trixie's own
          # Packages index.
          curl -fsSL \
            http://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb \
            -o /tmp/debian-archive-keyring.deb
          echo "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  /tmp/debian-archive-keyring.deb" \
            | sha256sum -c -
          sudo dpkg -i /tmp/debian-archive-keyring.deb

          # System-wide, not --user: the build runs under sudo, whose HOME is
          # /root, so a user install under /home/runner/.local is not importable.
          sudo python3 -m pip install --break-system-packages \
            "git+https://github.com/systemd/mkosi@v25.3"
          mkosi --version
          systemd-repart --version | head -1

      - name: Build service wheels
        run: |
          python3 -m venv .venv
          ./.venv/bin/pip install --upgrade pip
          make wheels
          ls -l os/image/wheels

      - name: Wheelhouse covers every image import
        run: |
          set -euo pipefail
          # openpc-provision died 17 times on the pilot image with
          # ModuleNotFoundError: dbus_next, because requirements-image.txt never
          # listed it. The wheelhouse install is `pip install --no-index`, so a
          # missing distribution cannot be resolved at boot - it has to be caught
          # here, at build time.
          python3 - <<'PY'
          import glob, os, re, sys

          wheels = [os.path.basename(w) for w in glob.glob('os/image/wheels/*.whl')]
          have = {w.split('-')[0].lower().replace('_', '-') for w in wheels}
          print(f"wheelhouse: {len(wheels)} wheels")

          reqs = []
          for raw in open('requirements-image.txt', encoding='utf-8'):
              line = raw.split('#')[0].strip()
              if line:
                  reqs.append(re.split(r'[=<>!~\[]', line)[0].strip().lower().replace('_', '-'))
          missing = [r for r in reqs if r not in have]

          # Modules the image services import unconditionally on their real paths.
          # import name -> distribution name
          required_imports = {
              'dbus_next': 'dbus-next',   # services/provisioning/.../bluez_dbus.py
              'websockets': 'websockets',
              'cryptography': 'cryptography',
          }
          for module, dist in required_imports.items():
              if dist not in have:
                  missing.append(f"{dist} (imported as {module})")

          if missing:
              print("::error::wheelhouse cannot satisfy the image:")
              for m in missing:
                  print("  missing:", m)
              sys.exit(1)
          print("wheelhouse covers every image requirement and import")
          PY

      - name: Fetch model weights
        run: |
          set -euo pipefail
          # Nothing in the tree ever put weights on the appliance, so llama died
          # with "failed to open GGUF file ... (No such file or directory)" on the
          # pilot image. The manifest names the model; this stages it.
          ./os/scripts/fetch-model
          ls -lh os/image/models
          ./os/scripts/fetch-model --check

      - name: Build image (pilot)
        run: |
          set -euo pipefail
          sudo mkdir -p "$MKOSI_OUTPUT" "$MKOSI_CACHE" /mnt/tmp
          sudo env \
            "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            "HOME=$HOME" \
            "XDG_CACHE_HOME=$MKOSI_CACHE" \
            "TMPDIR=/mnt/tmp" \
            "MKOSI_OUTPUT_DIR=$MKOSI_OUTPUT" \
            "MKOSI_CACHE_DIR=$MKOSI_CACHE" \
            ./os/scripts/build-image --target pilot
          ls -lh "$MKOSI_OUTPUT"
          df -h / /mnt

      - name: Cold-boot the image in QEMU
        run: |
          set -euo pipefail
          IMAGE="$(ls "$MKOSI_OUTPUT"/openpc-one*.raw | head -1)"
          echo "image: $IMAGE"
          sudo mkdir -p /mnt/img
          LOOP="$(sudo losetup -Pf --show "$IMAGE")"
          sudo partprobe "$LOOP" || true
          sudo udevadm settle || true
          sudo blkid
          ROOT="$(sudo blkid -L openpc-root-a)"
          test -n "$ROOT"
          sudo mount "$ROOT" /mnt/img

          # Probe runs as root after the appliance target, prints to the serial
          # console, then powers the VM off. It is injected into the root slot
          # here rather than baked into the image so the shipping image stays
          # probe-free. The console kernel argument is baked in at build time
          # (KernelCommandLine= in mkosi.conf) - the boot entry is a UKI, so
          # there is no loader entry left to patch.
          sudo mkdir -p /mnt/img/usr/local/sbin
          sudo tee /mnt/img/usr/local/sbin/openpc-smoke >/dev/null <<'SMOKE'
          #!/bin/bash
          exec >/dev/ttyS0 2>&1
          set +e
          echo "SMOKE_BEGIN"

          # openpc-provision is Type=simple and legitimately exits 0 on a wired
          # boot (the zero-setup fallback), so "active" is the WRONG test for it.
          # What must hold for EVERY unit is: not failed, and never restarted.
          MUST_BE_ACTIVE="openpc-led.service openpc-session.service openpc-engine.service llama.service cua-driver.service openpc-bless.service"
          WANTS=/etc/systemd/system/openpc.target.wants

          # Wait until the must-be-active set is genuinely up, not merely forked.
          # openpc.target is reached when Type=simple units have forked, and llama
          # and cua-driver used to die two seconds later while the old probe still
          # reported success.
          for _ in $(seq 1 90); do
            ok=1
            for u in $MUST_BE_ACTIVE; do
              systemctl is-active --quiet "$u" || ok=0
            done
            [ "$ok" = 1 ] && break
            sleep 10
          done

          # Give the crash-loopers time to reveal themselves before sampling.
          sleep 20

          # Per-unit verdict for everything openpc.target wants.
          for path in "$WANTS"/*.service; do
            unit=$(basename "$path")
            short=${unit%.service}
            state=$(systemctl is-active "$unit" 2>/dev/null)
            restarts=$(systemctl show -p NRestarts --value "$unit" 2>/dev/null)
            failed=$(systemctl is-failed --quiet "$unit" && echo yes || echo no)
            echo "SMOKE_U_${short}:state=${state}"
            echo "SMOKE_U_${short}:restarts=${restarts:-0}"
            echo "SMOKE_U_${short}:failed=${failed}"
          done

          # Listening sockets the appliance is supposed to hold open.
          # 8095 engine (WSS), 8080 llama.cpp HTTP.
          for _ in $(seq 1 60); do
            ss -ltn | awk '{print $4}' | grep -q ':8095$' && break
            sleep 5
          done
          for p in 8095 8080; do
            echo "SMOKE_PORT_${p}=$(ss -ltn | awk '{print $4}' | grep -c ":${p}\$")"
          done
          echo "SMOKE_SOCK_CUA=$( [ -S /run/openpc/cua-driver.sock ] && echo 1 || echo 0 )"

          echo "SMOKE_FAILED_BEGIN"
          systemctl --failed --no-legend
          echo "SMOKE_FAILED_END"
          echo "SMOKE_END"
          sync
          systemctl poweroff -f
          SMOKE
          sudo chmod 0755 /mnt/img/usr/local/sbin/openpc-smoke

          sudo tee /mnt/img/etc/systemd/system/openpc-smoke.service >/dev/null <<'UNIT'
          [Unit]
          Description=CI cold-boot probe
          After=openpc.target multi-user.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/openpc-smoke

          [Install]
          WantedBy=multi-user.target
          UNIT

          # A VM has no power-button ring. Exercise the LED loop with the mock.
          sudo mkdir -p /mnt/img/etc/systemd/system/openpc-led.service.d
          sudo tee /mnt/img/etc/systemd/system/openpc-led.service.d/ci-mock.conf >/dev/null <<'DROPIN'
          [Service]
          Environment=OPENPC_LED_MOCK=1
          DROPIN

          sudo mkdir -p /mnt/img/etc/systemd/system/multi-user.target.wants
          sudo ln -sf ../openpc-smoke.service \
            /mnt/img/etc/systemd/system/multi-user.target.wants/openpc-smoke.service

          sync
          sudo umount /mnt/img
          sudo losetup -d "$LOOP"

          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/OVMF_VARS.fd
          sudo timeout 2100 qemu-system-x86_64 \
            -machine q35,accel=tcg -cpu max -m 6144 -smp 4 \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=/tmp/OVMF_VARS.fd \
            -drive file="$IMAGE",format=raw,if=virtio,cache=unsafe \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial stdio -monitor none -no-reboot \
            >/tmp/serial.log 2>&1 || true

          echo "===== smoke lines ====="
          grep -E 'SMOKE_' /tmp/serial.log || true
          echo "===== serial tail ====="
          tail -120 /tmp/serial.log || true

          fail() { echo "::error::$1"; exit 1; }

          grep -q 'SMOKE_END' /tmp/serial.log || fail "VM never reached the smoke probe"

          # 1. The units that must be running are running.
          for u in openpc-led openpc-session openpc-engine llama cua-driver openpc-bless; do
            grep -q "SMOKE_U_${u}:state=active" /tmp/serial.log \
              || fail "$u is not active"
          done

          # 2. No unit restarted. Crash-loopers sit in `activating (auto-restart)`,
          #    so `systemctl --failed` alone cannot see them - NRestarts can.
          if grep -E 'SMOKE_U_[a-z-]+:restarts=[1-9]' /tmp/serial.log; then
            fail "one or more appliance units restarted (crash loop)"
          fi

          # 3. No unit is failed.
          if grep -qE 'SMOKE_U_[a-z-]+:failed=yes' /tmp/serial.log; then
            grep -E 'SMOKE_U_[a-z-]+:failed=yes' /tmp/serial.log
            fail "one or more appliance units are failed"
          fi

          # 4. The SMOKE_FAILED block must be empty. It was never asserted before,
          #    and it was not empty.
          blocked=$(awk '/SMOKE_FAILED_BEGIN/{f=1;next} /SMOKE_FAILED_END/{f=0} f' /tmp/serial.log \
                     | tr -d '[:space:]')
          [ -z "$blocked" ] || fail "systemctl --failed reported units: $blocked"

          # 5. Listener sockets. 8095 is the engine (WSS), 8080 is llama.cpp.
          grep -qE 'SMOKE_PORT_8095=[1-9]' /tmp/serial.log || fail "engine is not listening on 8095"
          grep -qE 'SMOKE_PORT_8080=[1-9]' /tmp/serial.log || fail "llama is not listening on 8080"

          # 6. cua-driver 0.33.3 is a unix-socket daemon, not a TCP listener.
          grep -q 'SMOKE_SOCK_CUA=1' /tmp/serial.log || fail "cua-driver socket missing"

          echo "smoke: every appliance unit is up, none restarted, listeners bound"

          # ------------------------------------------------------------------
          # De-inject the probe before this image is published.
          #
          # The probe, its unit and the LED mock were previously baked into the
          # artifact that got uploaded, so anyone booting it got the probe
          # enabled, OPENPC_LED_MOCK=1 forced on the real LED service, and a
          # hard poweroff ~10 s after openpc.target. That is a ship blocker for
          # a VM image handed to a tester.
          # ------------------------------------------------------------------
          LOOP2="$(sudo losetup -Pf --show "$IMAGE")"
          sudo partprobe "$LOOP2" || true
          sudo udevadm settle || true
          sudo mount "$(sudo blkid -L openpc-root-a)" /mnt/img
          sudo rm -f /mnt/img/usr/local/sbin/openpc-smoke \
                     /mnt/img/etc/systemd/system/openpc-smoke.service \
                     /mnt/img/etc/systemd/system/multi-user.target.wants/openpc-smoke.service \
                     /mnt/img/etc/systemd/system/openpc-led.service.d/ci-mock.conf
          sudo rmdir /mnt/img/etc/systemd/system/openpc-led.service.d 2>/dev/null || true
          sudo sync
          sudo umount /mnt/img
          sudo losetup -d "$LOOP2"

          # Prove the artifact is clean rather than asserting it.
          for marker in SMOKE_BEGIN OPENPC_LED_MOCK=1 openpc-smoke; do
            n=$(grep -a -c -- "$marker" "$IMAGE" || true)
            echo "deinject: $marker occurrences = ${n:-0}"
            [ "${n:-0}" = "0" ] || fail "image still contains '$marker' after de-injection"
          done

      - name: Upload image
        if: success()
        run: |
          set -euo pipefail
          # Match the .raw file, not mkosi's extensionless symlink to it:
          # zstd refuses to compress a symlink ("is a symbolic link, ignoring").
          IMAGE="$(ls -1 "$MKOSI_OUTPUT"/openpc-one*.raw | head -1)"
          zstd -T0 -6 -o /tmp/openpc-one-image.zst "$IMAGE"
          ls -lh /tmp/openpc-one-image.zst

          # Publish hashes. Previously the workflow never printed or published a
          # hash of either file, so artifact-to-boot-log identity rested on step
          # ordering inside a single job.
          RAW_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          ZST_SHA="$(sha256sum /tmp/openpc-one-image.zst | awk '{print $1}')"
          RAW_SIZE="$(stat -c %s "$IMAGE")"
          echo "IMAGE_NAME=$(basename "$IMAGE")" >> "$GITHUB_ENV"
          echo "RAW_SHA=$RAW_SHA" >> "$GITHUB_ENV"
          echo "ZST_SHA=$ZST_SHA" >> "$GITHUB_ENV"
          {
            echo "### Open-PC One pilot image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| raw file | \`$(basename "$IMAGE")\` |"
            echo "| raw bytes | $RAW_SIZE |"
            echo "| raw sha256 | \`$RAW_SHA\` |"
            echo "| zst sha256 | \`$ZST_SHA\` |"
            echo "| probe-free | yes (de-injected and byte-verified) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "raw sha256: $RAW_SHA"
          echo "zst sha256: $ZST_SHA"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openpc-one-pilot-image
          path: /tmp/openpc-one-image.zst
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openpc-boot-log
          path: /tmp/serial.log
          if-no-files-found: ignore
          retention-days: 14
