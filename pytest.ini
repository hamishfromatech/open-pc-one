[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    services/engine/tests
    services/provisioning/tests
    services/led/tests
    os/tests
addopts = -q -m "not hardware"
markers =
    hardware: needs a physical radio, LED ring or other appliance hardware (skipped by default)
filterwarnings =
    ignore::DeprecationWarning
