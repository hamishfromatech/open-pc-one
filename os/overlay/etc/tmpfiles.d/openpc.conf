d /run/openpc 0755 openpc openpc -
d /run/openpc/chrome 0700 openpc openpc -
d /run/openpc/chrome/cache 0700 openpc openpc -
d /run/openpc/chrome/config 0700 openpc openpc -
d /var/lib/openpc 0700 openpc openpc -
d /var/lib/openpc/sessions 0700 openpc openpc -
d /var/lib/openpc/tls 0700 openpc openpc -
d /var/lib/openpc/models 0755 openpc openpc -
# llama.service names this in ReadWritePaths; a missing path fails the unit
# before llama-server ever runs (and /var is a separate partition, so the
# build-time copy in mkosi.postinst is not there).
d /var/lib/openpc/llama-cache 0755 openpc openpc -
# Flag files: readable by the LED service (root), writable by the engine.
f /run/openpc/attention 0644 root root -
# Xvfb runs as openpc and cannot create this directory in the sticky /tmp.
# Without it every X client logs "_XSERVTransmkdir: ERROR: euid != 0".
d /tmp/.X11-unix 1777 root root -
# cua-driver writes its telemetry-off marker under $HOME. The root filesystem
# is read-only, so give it a writable home of its own rather than making
# /home/openpc writable.
d /var/lib/openpc/cua-driver 0700 openpc openpc -
