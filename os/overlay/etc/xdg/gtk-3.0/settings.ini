# AmaaraOS GTK defaults. System-wide because the box has one user and no settings
# UI: /etc/xdg is the only place a default reliably comes from.
#
# GKeyFile syntax: comments start with '#', never ';'. Adwaita is the base theme
# (it ships with GTK and matches the icon set); the parts that matter are the
# font, the icon theme and the light appearance.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus
gtk-font-name=Inter 10.5
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-rgba=rgb
gtk-application-prefer-dark-theme=false
gtk-enable-animations=true
gtk-cursor-theme-name=Adwaita
gtk-menu-images=false
gtk-button-images=false
