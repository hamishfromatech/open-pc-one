# Kernel hardening for an unattended box on an untrusted LAN.

# No IP forwarding: this is a client, not a router.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# SYN flood resilience and martian logging off (journald has a budget).
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.log_martians = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Do not respond to broadcast pings: it makes the box findable by scanners.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Bounded queues: a local model with 256k context plus Chrome can otherwise
# exhaust memory in kernel buffers before the OOM killer notices.
net.core.somaxconn = 1024
net.ipv4.tcp_max_syn_backlog = 1024
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608

# Swap is off on the appliance image (zram only); keep the kernel from
# over-committing memory the box cannot back.
vm.overcommit_memory = 0
vm.swappiness = 10

# Restrict kernel pointer exposure.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Perf events are an infoleak and nothing on the box needs them.
kernel.perf_event_paranoid = 3
