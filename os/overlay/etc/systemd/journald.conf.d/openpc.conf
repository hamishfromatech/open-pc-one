[Journal]
# The root filesystem is read-only and the eMMC/NVMe is the one component that
# wears out. Cap the journal and keep it on /var with a hard budget.
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=512M
RuntimeMaxUse=64M
MaxRetentionSec=14day
# A runaway agent loop can log megabytes a second; drop the flood, keep the
# entries around it.
RateLimitIntervalSec=30s
RateLimitBurst=2000
ForwardToSyslog=no
Compress=yes
