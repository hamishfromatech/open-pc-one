# AmaaraOS update feed.
#
# Empty FEED_URL disables updates: a box with no feed configured answers "no feed
# configured" and downloads nothing, which is the correct default until a feed
# exists to point at.
FEED_URL=

# Which channel this box tracks. A manifest for another channel is refused, so a
# pilot box cannot be talked into a retail image by a misposted manifest.
CHANNEL=pilot

# Yes means the daily timer applies an update on its own. No means it only checks
# and says so, and an operator runs `amaara-update apply`. Default is no: an
# appliance that rewrites a root slot unattended needs a support team behind it.
AUTO_APPLY=no
