# Appliance network posture: no inbound ports from outside the LAN.
#
# There is no screen and no router admin credential on the box, so the firewall
# is the only thing standing between the agent and the internet at large.

# Services are scoped to the local-link interfaces, not to an address range:
# the box can be provisioned onto any LAN subnet and the policy still holds.
# A packet arriving on a routable interface is dropped.
define lan_ifaces = { "wlan0", "eth0" }

table inet openpc {
  chain input {
    type filter hook input priority filter; policy drop;

    # Established/related, loopback, ICMP.
    ct state established,related accept
    iif lo accept
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept

    # SSH only on the local link, for the operator. Disabled on retail images.
    iifname $lan_ifaces tcp dport 22 accept

    # The engine (:8095) and the Open-PC agent server (:8090) for the
    # desktop/mobile clients on the same network. Two endpoints, per the
    # design brief §9.
    iifname $lan_ifaces tcp dport { 8090, 8095 } accept

    # mDNS so clients can find _openpc._tcp without an IP.
    udp dport 5353 accept
    udp dport 67 accept

    # DHCP client replies.
    udp sport 68 udp dport 68 accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  # The agent gets outbound TCP/UDP; it does not get to host anything, and it
  # cannot reach the LAN beyond DHCP/DNS/mDNS (no lateral movement).
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
