# Slot A: the root filesystem this build produces.
[Partition]
Type=root-x86-64
Label=openpc-root-a
SizeMinBytes=8G
Format=ext4
# Copy the whole image tree. A leading '@' is not systemd-repart syntax: it
# resolves to a literal '/@' directory, which does not exist, so the partition
# is left empty and the kernel never finds a root filesystem.
CopyFiles=/
