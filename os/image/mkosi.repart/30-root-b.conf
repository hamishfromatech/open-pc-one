# Slot B: intentionally empty in the factory image.
#
# `ota-update` writes a new rootfs here and arms a three-try boot. Shipping it
# pre-sized means the first update never has to repartition a device in the
# field - the operation most likely to brick a box.
[Partition]
Type=root-x86-64
Label=openpc-root-b
SizeMinBytes=8G
Format=ext4
