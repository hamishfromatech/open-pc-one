[Partition]
Type=esp
Label=esp
SizeMinBytes=1G
SizeMaxBytes=1G
Format=vfat
# mkosi stages systemd-boot under /efi and kernels/UKIs/entries under /boot.
# With a custom RepartDirectories= mkosi does not add its own ESP rule, so the
# only thing that puts the bootloader on the ESP is this pair of lines. Without
# them the image has an empty ESP and QEMU boots the firmware shell.
CopyFiles=/boot:/
CopyFiles=/efi:/
