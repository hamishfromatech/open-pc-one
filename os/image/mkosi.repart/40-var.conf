# /var: sessions, models, device registry, the LUKS-wrapped state the appliance
# cannot regenerate. Separate from the read-only root so an OTA update never
# touches it.
[Partition]
Type=var
Label=openpc-var
SizeMinBytes=4G
Format=ext4
# systemd-gpt-auto-generator mounts this at /var by partition type. Populate it
# from the image's /var (state dirs, journal budget); repart excludes those
# contents from the root slot automatically because /var is a mount point of
# another partition.
CopyFiles=/var:/
