[Distribution]
Distribution=debian
Release=trixie
# Everything is built from the Debian archive; the only out-of-archive
# artefacts are pinned and hashed in mkosi.postinst.

[Output]
Format=disk
ImageId=openpc-one
ImageVersion=0.1.0
# No DiskSize=: mkosi 25 removed it and sizes the image to the partitions
# (systemd-repart --size=auto), so the artifact is exactly as large as
# esp(1G) + root-a(8G) + root-b(8G) + var(4G).
# The partition layout lives in mkosi.repart/, which is mkosi's default
# (RepartDirectories= is therefore not spelled out here).

[Content]
# Bootable= and Hostname= belong to [Content] in mkosi 24+. In [Output] or
# [Validation] mkosi 25 only warns and ignores them, which silently produced an
# image with an empty ESP.
Bootable=yes
Bootloader=systemd-boot
Hostname=openpc

# The kernel command line is baked into the boot entry at build time.
# `root=PARTUUID` is a literal placeholder: mkosi replaces it with the root
# slot's real partition UUID. Without it the kernel gets no root= at all.
# ttyS0 is how CI (and a field engineer with a cable) sees the boot.
KernelCommandLine=root=PARTUUID rw console=ttyS0,115200 systemd.journald.forward_to_console=1

WithDocs=no
# The overlay is the image: units, tmpfiles, sysctl, nftables, presets.
ExtraTrees=../overlay:/

# Deliberately no editors, no compilers, no desktop email client: the attack
# surface is the agent, and the agent does not need them.
Packages=
    systemd
    systemd-boot
    # systemd-boot pulls the signed EFI binaries; mkosi installs the unsigned
    # systemd-boot/stub from this package, so it must be explicit.
    systemd-boot-efi
    systemd-resolved
    systemd-timesyncd
    systemd-zram-generator
    # Debian ships the cryptenroll/cryptsetup binaries in this package; there
    # is no systemd-cryptenroll package.
    systemd-cryptsetup
    linux-image-amd64
    initramfs-tools
    network-manager
    bluez
    avahi-daemon
    nftables
    # `ss` in the CI probe; also what NetworkManager expects to find.
    iproute2
    curl
    jq
    ca-certificates
    # Provides /usr/sbin/nologin, the openpc user's shell; without it useradd
    # warns that the shell is missing.
    login
    python3
    python3-venv
    xvfb
    x11-utils
    x11-xserver-utils
    xfce4-session
    # A window manager: Chrome opens at 0x0 without one, and cua-driver needs a
    # real window to drive. Recommends are off, so xfwm4 is not pulled in.
    xfwm4
    dbus-x11
    chromium
    tpm2-tools
    cryptsetup
    rsync
    sudo
    openssh-server

[Build]
# mkosi copies mkosi.postinst to /work/postinst and mounts the build sources at
# /work/src. The postinst needs the licence, os/scripts and
# os/image/{artifacts,wheels}, all of which live above this directory, so mount
# the repository root rather than os/image/.
BuildSources=../..
