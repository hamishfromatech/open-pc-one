[Distribution]
Distribution=debian
Release=trixie
# Everything is built from the Debian archive; the only out-of-archive
# artefacts are pinned and hashed in mkosi.postinst.

[Output]
Format=disk
ImageId=openpc-one
ImageVersion=0.1.0
Hostname=openpc
Bootable=yes
RepartDirectories=mkosi.repart
# A 512 GB NVMe in the shipping unit; the image must fit the smallest one we
# will ever ship.
DiskSize=24G

[Content]
Bootloader=systemd-boot
WithDocs=no
WithMan=no
PackageManagerTrees=
# Deliberately no editors, no compilers, no desktop email client: the attack
# surface is the agent, and the agent does not need them.
Packages=
    systemd
    systemd-boot
    systemd-resolved
    systemd-timesyncd
    systemd-zram-generator
    systemd-cryptenroll
    linux-image-amd64
    initramfs-tools
    network-manager
    bluez
    avahi-daemon
    nftables
    curl
    jq
    ca-certificates
    python3
    python3-venv
    xvfb
    x11-utils
    x11-xserver-utils
    xfce4-session
    dbus-x11
    chromium
    tpm2-tools
    cryptsetup
    rsync
    sudo
    openssh-server

[Validation]
# The image must boot with no console attached; anything that only works with a
# serial cable is a defect.
Bootable=yes
